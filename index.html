<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Star Chart">
<meta name="theme-color" content="#7A5CF0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237A5CF0'/%3E%3Cpath d='M50 18l9.9 20.1 22.1 3.2-16 15.6 3.8 22-19.8-10.4-19.8 10.4 3.8-22-16-15.6 22.1-3.2z' fill='%23FFC22E'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237A5CF0'/%3E%3Cpath d='M50 18l9.9 20.1 22.1 3.2-16 15.6 3.8 22-19.8-10.4-19.8 10.4 3.8-22-16-15.6 22.1-3.2z' fill='%23FFC22E'/%3E%3C/svg%3E">
<title>Attendance Star Chart</title>
<style>
  :root{
    --bg:#FFF9F0;--card:#FFFFFF;--ink:#2C2447;--ink-soft:#7C748F;--line:#EFE7DA;--line-strong:#E2D8C7;
    --green:#2FB56A;--green-deep:#1E8E52;--green-soft:#E4F6EC;--danger:#F0554B;
    --accent:#7A5CF0;--accent-soft:#EEE9FE;--gold:#FFC22E;--kidc:#7A5CF0;
    --amber:#E8952B;--amber-soft:#FBEBD4;
    --shadow:0 2px 0 rgba(44,36,71,.05), 0 12px 26px -16px rgba(44,36,71,.4);
    --sans:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.45;-webkit-text-size-adjust:100%;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(122,92,240,.10) 0 8px, transparent 9px),
      radial-gradient(circle at 82% 12%, rgba(255,194,46,.16) 0 7px, transparent 8px),
      radial-gradient(circle at 68% 42%, rgba(47,181,106,.10) 0 6px, transparent 7px),
      radial-gradient(circle at 24% 68%, rgba(240,85,75,.10) 0 7px, transparent 8px),
      radial-gradient(circle at 90% 78%, rgba(59,155,232,.12) 0 6px, transparent 7px),
      radial-gradient(circle at 40% 92%, rgba(255,194,46,.13) 0 5px, transparent 6px);
    background-attachment:fixed;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:560px;margin:0 auto;padding:14px 16px 70px;}

  .topbar{display:flex;justify-content:flex-end;margin:2px 2px 6px;}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;border:2px solid var(--line-strong);background:var(--card);color:var(--ink-soft);cursor:pointer;font-family:inherit;}
  .pill .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-soft);}
  .pill.local .dot{background:#B4ADC2;}
  .pill.synced{color:var(--green-deep);border-color:var(--green);} .pill.synced .dot{background:var(--green);}
  .pill.syncing{color:var(--amber);border-color:var(--amber);} .pill.syncing .dot{background:var(--amber);animation:blink 1s infinite;}
  .pill.offline{color:var(--danger);border-color:var(--danger);} .pill.offline .dot{background:var(--danger);}
  @keyframes blink{50%{opacity:.3;}}

  .kidbar{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .kidbar::-webkit-scrollbar{display:none;}
  .kid{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;padding:0;cursor:pointer;width:62px;}
  .kid .bubble{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:#fff;border:3px solid var(--line-strong);transition:transform .12s ease;}
  .kid.active .bubble{border-color:var(--kidc);box-shadow:0 0 0 4px color-mix(in srgb, var(--kidc) 22%, transparent);transform:translateY(-2px) scale(1.04);}
  .kid .kn{font-size:12px;font-weight:700;color:var(--ink-soft);max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kid.active .kn{color:var(--ink);}
  .kid.add .bubble{border-style:dashed;color:var(--ink-soft);font-size:30px;background:transparent;}

  header{display:flex;align-items:center;gap:12px;margin:6px 2px 18px;}
  .h-ava{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--accent-soft);border:2px solid var(--accent);flex:0 0 auto;}
  .h-text{min-width:0;}
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:800;}
  h1{font-size:26px;line-height:1.1;margin:1px 0 0;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;}
  .pencil{background:none;border:none;cursor:pointer;font-size:16px;padding:2px 4px;border-radius:8px;color:var(--ink-soft);}
  .pencil:hover{background:var(--accent-soft);}

  .marking{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line-strong);border-radius:18px;padding:9px 11px;box-shadow:var(--shadow);margin-bottom:14px;}
  .marking .label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);font-weight:800;}
  .marking .date{font-weight:800;font-size:16px;flex:1;}
  .marking .date small{display:block;font-weight:600;font-size:11px;color:var(--ink-soft);}
  .step{width:42px;height:42px;flex:0 0 auto;border-radius:13px;border:2px solid var(--line-strong);background:#fff;font-size:22px;color:var(--ink);cursor:pointer;display:grid;place-items:center;font-weight:800;}
  .step:active{transform:translateY(1px);}
  .today-btn{border:none;background:var(--accent);color:#fff;font-weight:800;font-size:12px;padding:10px 13px;border-radius:12px;cursor:pointer;font-family:inherit;}
  .today-btn[disabled]{opacity:.35;cursor:default;}
  .date-holder{position:relative;}
  input[type=date].hiddendate{position:absolute;opacity:0;width:100%;height:100%;left:0;top:0;cursor:pointer;}

  .range{margin:0 2px 16px;}
  .range .rlabel{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);font-weight:800;margin:0 0 8px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{border:2px solid var(--line-strong);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .chip[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent);}
  .custom-dates{display:none;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;}
  .custom-dates.show{display:flex;}
  .custom-dates label{font-size:12px;color:var(--ink-soft);font-weight:700;display:flex;flex-direction:column;gap:3px;}
  .custom-dates input{font:inherit;padding:8px 9px;border:2px solid var(--line-strong);border-radius:10px;background:#fff;color:var(--ink);}

  .cards{display:flex;flex-direction:column;gap:14px;}
  .card{background:var(--card);border:2px solid var(--line-strong);border-radius:20px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--kidc);}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .cname{font-size:19px;font-weight:800;letter-spacing:-.01em;word-break:break-word;padding-left:4px;}
  .menu-btn{border:none;background:transparent;color:var(--ink-soft);font-size:24px;line-height:1;width:34px;height:30px;border-radius:9px;cursor:pointer;flex:0 0 auto;margin:-4px -6px 0 0;}
  .menu-btn:hover{background:var(--bg);}
  .readout{display:flex;align-items:baseline;gap:9px;margin:8px 0 0;padding-left:4px;}
  .bignum{font-size:46px;font-weight:800;line-height:1;color:var(--kidc);letter-spacing:-.03em;}
  .unit{font-size:13px;color:var(--ink-soft);font-weight:700;}
  .alltime{margin-left:auto;text-align:right;font-size:11px;color:var(--ink-soft);font-weight:700;}
  .alltime b{display:block;color:var(--ink);font-size:15px;}
  .stars{margin:12px 0 14px;padding-left:4px;min-height:28px;display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;}
  .stars .more{font-size:13px;color:var(--ink-soft);font-weight:800;margin-left:2px;}
  .stars .empty{font-size:13px;color:var(--ink-soft);font-style:italic;}
  .mark-btn{width:100%;border:2.5px solid var(--green);background:#fff;color:var(--green-deep);font-weight:800;font-size:15px;padding:14px;border-radius:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;transition:background .12s ease;}
  .mark-btn:active{transform:translateY(1px);}
  .mark-btn.on{background:var(--green);border-color:var(--green);color:#fff;}
  .mark-btn .tick{font-size:18px;}

  .cal-toggle-row{margin-top:12px;text-align:center;}
  .cal-toggle{border:none;background:transparent;color:var(--accent);font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;padding:7px 12px;border-radius:11px;}
  .cal-toggle:hover{background:var(--accent-soft);}
  .cal{margin-top:12px;border-top:2px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:18px;}
  .cal-note{font-size:12px;color:var(--ink-soft);text-align:center;}
  .cal-title{font-weight:800;font-size:14px;margin-bottom:8px;text-align:center;color:var(--ink);}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;}
  .cal-dow span{text-align:center;font-size:10px;font-weight:800;color:var(--ink-soft);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-cell{aspect-ratio:1;border:none;background:var(--bg);border-radius:10px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;display:grid;place-items:center;padding:0;line-height:1;}
  .cal-cell:active{transform:scale(.92);}
  .cal-cell.blank{background:transparent;cursor:default;}
  .cal-cell.out{opacity:.32;}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--accent);}
  .cal-cell.present{color:#fff;}
  .cal-legend{display:flex;justify-content:center;gap:16px;font-size:11px;color:var(--ink-soft);font-weight:700;}
  .cal-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px;}

  .add-btn{width:100%;margin-top:16px;border:2.5px dashed var(--line-strong);background:transparent;color:var(--ink-soft);font-weight:800;font-size:15px;padding:16px;border-radius:16px;cursor:pointer;font-family:inherit;}
  .add-btn:hover{border-color:var(--accent);color:var(--accent);}

  .tools{margin-top:26px;padding-top:18px;border-top:2px dashed var(--line-strong);display:flex;flex-direction:column;gap:10px;}
  .tools h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:6px 2px 2px;font-weight:800;}
  .tool-row{display:flex;gap:10px;}
  .tool-btn{flex:1;border:2px solid var(--line-strong);background:var(--card);color:var(--ink);font-weight:800;font-size:14px;padding:13px;border-radius:13px;cursor:pointer;font-family:inherit;}
  .tool-btn:active{transform:translateY(1px);}
  .tools p{font-size:12px;color:var(--ink-soft);margin:4px 2px 0;line-height:1.5;}

  .empty-state{text-align:center;color:var(--ink-soft);padding:34px 16px;border:2.5px dashed var(--line-strong);border-radius:20px;background:var(--card);}
  .empty-state .em{font-size:40px;display:block;margin-bottom:8px;}
  .empty-state b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;}

  .overlay{position:fixed;inset:0;background:rgba(44,36,71,.42);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:24px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px -12px rgba(0,0,0,.4);animation:rise .18s ease;max-height:88vh;overflow-y:auto;}
  @keyframes rise{from{transform:translateY(26px);opacity:.5;}to{transform:none;opacity:1;}}
  .sheet h3{margin:0 0 4px;font-size:20px;font-weight:800;}
  .sheet p{margin:0 0 16px;color:var(--ink-soft);font-size:14px;}
  .sheet label.fld{display:block;font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px;}
  .sheet input[type=text]{width:100%;font:inherit;font-size:16px;padding:14px;border:2px solid var(--line-strong);border-radius:14px;background:#fff;color:var(--ink);margin-bottom:16px;}
  .grid-label{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em;margin:0 0 8px;}
  .emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px;}
  .emoji-grid button{font-size:26px;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:8px 0;cursor:pointer;}
  .emoji-grid button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);}
  .swatches{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .swatches button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 0 0 2px var(--line-strong);}
  .swatches button[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink);transform:scale(1.1);}
  .sheet .actions{display:flex;gap:10px;}
  .btn{flex:1;border:none;font-weight:800;font-size:15px;padding:15px;border-radius:14px;cursor:pointer;font-family:inherit;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line-strong);}
  .btn.warn{background:var(--danger);color:#fff;}
  .btn.col{flex-direction:column;}
  .result{font-size:13px;font-weight:700;padding:12px 14px;border-radius:12px;margin-bottom:14px;line-height:1.45;display:none;}
  .result.ok{display:block;background:var(--green-soft);color:var(--green-deep);}
  .result.bad{display:block;background:#FDE6E5;color:#B23B30;}
  .guide{background:var(--bg);border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:13px;color:var(--ink);line-height:1.6;}
  .guide ol{margin:6px 0 0;padding-left:20px;} .guide li{margin-bottom:7px;}
  .guide code{background:#fff;border:1px solid var(--line-strong);border-radius:6px;padding:1px 6px;font-size:12px;word-break:break-all;}
  .guide a{color:var(--accent);font-weight:700;}
  .disc{font-size:11px;color:var(--ink-soft);margin:0 0 14px;line-height:1.5;}
  .share-box{background:var(--accent-soft);border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:13px;word-break:break-all;}
  .share-box b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:2px;}
  .share-box .v{font-weight:800;margin-bottom:10px;}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;box-shadow:0 8px 24px -8px rgba(0,0,0,.5);max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .pop{position:fixed;font-size:20px;pointer-events:none;z-index:70;will-change:transform,opacity;}

  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><button class="pill local" id="statusPill"><span class="dot"></span><span id="statusText">On this phone</span></button></div>

  <div class="kidbar" id="kidbar"></div>

  <header>
    <div class="h-ava" id="hAva">🙂</div>
    <div class="h-text">
      <div class="eyebrow">Attendance Chart</div>
      <h1><span id="kidName">—</span><button class="pencil" id="editKid" aria-label="Edit this kid">✎</button></h1>
    </div>
  </header>

  <div class="marking" id="markingBar">
    <span class="step" id="prevDay" aria-label="Previous day">‹</span>
    <div class="date date-holder">
      <span class="label">Recording for</span>
      <span id="markDateText">Today</span>
      <small id="markDateSub"></small>
      <input type="date" class="hiddendate" id="markDatePicker" aria-label="Pick the day to record">
    </div>
    <span class="step" id="nextDay" aria-label="Next day">›</span>
    <button class="today-btn" id="jumpToday">Today</button>
  </div>

  <div class="range" id="rangeWrap">
    <p class="rlabel">Count over</p>
    <div class="chips" id="chips">
      <button class="chip" data-range="month">This month</button>
      <button class="chip" data-range="30">Last 30 days</button>
      <button class="chip" data-range="year">This year</button>
      <button class="chip" data-range="all" aria-pressed="true">All time</button>
      <button class="chip" data-range="custom">Custom</button>
    </div>
    <div class="custom-dates" id="customDates">
      <label>From<input type="date" id="rangeFrom"></label>
      <label>To<input type="date" id="rangeTo"></label>
    </div>
  </div>

  <div class="cards" id="cards"></div>
  <button class="add-btn" id="addClass">+ Add a class</button>

  <div class="tools">
    <h2>Share with another phone</h2>
    <button class="tool-btn" id="syncBtn" style="flex:none;">📲 Sharing &amp; sync</button>

    <h2>Keep your data safe</h2>
    <div class="tool-row">
      <button class="tool-btn" id="exportBtn">⬇ Back up</button>
      <button class="tool-btn" id="importBtn">⬆ Restore</button>
    </div>
    <p>Data is stored on this phone. Turn on sharing to sync live with another phone, and back up now and then so nothing is ever lost.</p>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none">
  </div>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
(function(){
  /* ================= PURE SYNC CORE (unit-tested separately) ================= */
  function deepGet(tree,path){ if(!path) return tree; var s=path.split('/'),n=tree; for(var i=0;i<s.length;i++){ if(n==null) return undefined; n=n[s[i]]; } return n; }
  function deepSet(tree,path,val){ if(!path) return val; var s=path.split('/'),n=tree||{},cur=n; for(var i=0;i<s.length-1;i++){ if(typeof cur[s[i]]!=='object'||cur[s[i]]==null) cur[s[i]]={}; cur=cur[s[i]]; } cur[s[s.length-1]]=val; return n; }
  function deepMerge(tree,path,val){ var node=deepGet(tree,path); var m=Object.assign({},(node&&typeof node==='object')?node:{},val); return deepSet(tree,path,m); }
  function deepDelete(tree,path){ var s=path.split('/'),n=tree; for(var i=0;i<s.length-1;i++){ if(n==null) return tree; n=n[s[i]]; } if(n) delete n[s[s.length-1]]; return tree; }
  function applyRest(tree,op){ tree=tree||{}; if(op.method==='PUT'){ return op.path?deepSet(tree,op.path,op.body):op.body; } if(op.method==='PATCH'){ return deepMerge(tree,op.path,op.body); } if(op.method==='DELETE'){ return deepDelete(tree,op.path); } return tree; }

  function stateToTree(state){
    var tree={meta:{kids:{}},records:{}};
    (state.kids||[]).forEach(function(k,ki){
      var kn={name:k.name,emoji:k.emoji,color:k.color,soft:k.soft,order:ki,classes:{}};
      (k.classes||[]).forEach(function(c,ci){
        kn.classes[c.id]={name:c.name,order:ci};
        var recs=c.records||{},has=false,out={};
        for(var d in recs){ if(recs[d]){ out[d]=true; has=true; } }
        if(has){ tree.records[k.id]=tree.records[k.id]||{}; tree.records[k.id][c.id]=out; }
      });
      tree.meta.kids[k.id]=kn;
    });
    return tree;
  }
  function treeToState(tree,prevActiveId){
    var mk=(tree&&tree.meta&&tree.meta.kids)||{}, recAll=(tree&&tree.records)||{};
    var kids=Object.keys(mk).map(function(id){
      var k=mk[id]||{}, classesObj=k.classes||{};
      var classes=Object.keys(classesObj).map(function(cid){
        var c=classesObj[cid]||{}, recs=(recAll[id]&&recAll[id][cid])||{}, r={};
        for(var d in recs){ if(recs[d]) r[d]=true; }
        return {id:cid,name:c.name,order:(c.order==null?0:c.order),records:r};
      }).sort(function(a,b){return a.order-b.order;}).map(function(c){ delete c.order; return c; });
      return {id:id,name:k.name,emoji:k.emoji,color:k.color,soft:k.soft,order:(k.order==null?0:k.order),classes:classes};
    }).sort(function(a,b){return a.order-b.order;}).map(function(k){ delete k.order; return k; });
    var activeKidId=(prevActiveId&&kids.some(function(k){return k.id===prevActiveId;}))?prevActiveId:(kids.length?kids[0].id:null);
    return {kids:kids,activeKidId:activeKidId};
  }
  function opMarkDay(kidId,classId,date,val){ return [{method:val?'PUT':'DELETE',path:'records/'+kidId+'/'+classId+'/'+date,body:val?true:undefined}]; }
  function opAddKid(kid,order){ return [{method:'PUT',path:'meta/kids/'+kid.id,body:{name:kid.name,emoji:kid.emoji,color:kid.color,soft:kid.soft,order:order,classes:{}}}]; }

  /* ================= CONSTANTS ================= */
  var PALETTE=[
    {name:"Grape",c:"#7A5CF0",soft:"#EEE9FE"},{name:"Berry",c:"#E85D9A",soft:"#FCE7F1"},
    {name:"Tangerine",c:"#F58A3C",soft:"#FDECDD"},{name:"Grass",c:"#3BAF5A",soft:"#E4F6EA"},
    {name:"Sky",c:"#3B9BE8",soft:"#E2F0FC"},{name:"Teal",c:"#14B5A6",soft:"#DEF6F3"},
    {name:"Cherry",c:"#EF5350",soft:"#FDE6E5"},{name:"Sun",c:"#EBAF17",soft:"#FBF0D3"}
  ];
  var EMOJIS=["🦄","🐶","🐱","🦖","🐰","🐼","🦊","🐸","🦁","🐵","🐧","🐢","🐨","🐷","🌟","🚀"];

  var K_TREE="att.tree.v3", K_UI="att.ui.v3", K_SYNC="att.sync.v3", K_QUEUE="att.queue.v3";

  /* ================= LOCAL DATA ================= */
  var localTree={meta:{kids:{}},records:{}};

  var ui={activeKidId:null};

  var range={mode:"all",from:null,to:null};

  function saveLocal(){ try{ localStorage.setItem(K_TREE,JSON.stringify(localTree)); localStorage.setItem(K_UI,JSON.stringify(ui)); }catch(e){} }
  function rebuildState(){ state=treeToState(localTree, ui.activeKidId); ui.activeKidId=state.activeKidId; }
  function loadLocal(){
    try{
      var t=localStorage.getItem(K_TREE);
      if(t){ localTree=JSON.parse(t); }
      else{
        var v2=localStorage.getItem("attendance.register.v2");
        var v1=localStorage.getItem("attendance.register.v1");
        if(v2){ var d2=JSON.parse(v2); localTree=stateToTree({kids:d2.kids||[]}); ui.activeKidId=d2.activeKidId||null; }
        else if(v1){ var d1=JSON.parse(v1); var p=PALETTE[0];
          localTree=stateToTree({kids:[{id:"k"+Date.now(),name:d1.name||"My kid",emoji:"🌟",color:p.c,soft:p.soft,classes:d1.classes||[]}]}); }
      }
      var u=localStorage.getItem(K_UI); if(u){ var uu=JSON.parse(u); if(uu&&uu.activeKidId) ui.activeKidId=uu.activeKidId; }
      var sc=localStorage.getItem(K_SYNC); if(sc){ syncCfg=JSON.parse(sc); }
      var q=localStorage.getItem(K_QUEUE); if(q){ queue=JSON.parse(q)||[]; }
    }catch(e){}
    if(!localTree||typeof localTree!=='object') localTree={meta:{kids:{}},records:{}};
    rebuildState();
    saveLocal();
  }
  function kidId(){ return "k"+Date.now()+Math.floor(Math.random()*9999); }
  function classId(){ return "c"+Date.now()+Math.floor(Math.random()*9999); }

  /* ================= MUTATIONS (local + sync) ================= */
  function applyOps(ops){
    ops.forEach(function(op){ localTree=applyRest(localTree,op); });
    rebuildState(); saveLocal();
    if(syncOn()){ ops.forEach(function(op){ queue.push(op); }); saveQueue(); scheduleFlush(); }
  }

  /* ================= SYNC ================= */
  var syncCfg=null, queue=[], flushing=false, pulling=false, pollTimer=null, status="local";
  function syncOn(){ return !!(syncCfg&&syncCfg.dbUrl&&syncCfg.code); }
  function saveSync(){ try{ syncCfg?localStorage.setItem(K_SYNC,JSON.stringify(syncCfg)):localStorage.removeItem(K_SYNC); }catch(e){} }
  function saveQueue(){ try{ localStorage.setItem(K_QUEUE,JSON.stringify(queue)); }catch(e){} }
  function cleanUrl(u){ return (u||"").trim().replace(/\/+$/,""); }
  function cleanCode(c){ return (c||"").trim().replace(/[^a-zA-Z0-9_-]/g,"-").replace(/^-+|-+$/g,""); }
  function baseUrl(cfg){ cfg=cfg||syncCfg; return cleanUrl(cfg.dbUrl)+"/spaces/"+encodeURIComponent(cleanCode(cfg.code)); }
  function urlFor(path,cfg){ return baseUrl(cfg)+(path?"/"+path:"")+".json"; }

  function apiGet(path,cfg){ return fetch(urlFor(path,cfg),{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }); }
  function apiSend(op,cfg){
    var init={method:op.method};
    if(op.method==="PUT"||op.method==="PATCH"){ init.headers={"Content-Type":"application/json"}; init.body=JSON.stringify(op.body===undefined?null:op.body); }
    return fetch(urlFor(op.path,cfg),init).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return true; });
  }

  function setStatus(s){ status=s; renderStatus(); }
  function renderStatus(){
    var pill=document.getElementById("statusPill"), txt=document.getElementById("statusText");
    pill.className="pill "+(syncOn()?status:"local");
    txt.textContent = !syncOn() ? "On this phone" :
      status==="synced" ? "Synced" : status==="syncing" ? "Syncing…" : status==="offline" ? "Offline" : "Synced";
  }

  function scheduleFlush(){ flush().catch(function(){}); }
  function flush(){
    if(!syncOn()||flushing||!queue.length) return Promise.resolve();
    flushing=true; setStatus("syncing");
    function step(){
      if(!queue.length){ flushing=false; setStatus("synced"); return Promise.resolve(); }
      var op=queue[0];
      return apiSend(op).then(function(){ queue.shift(); saveQueue(); return step(); })
        .catch(function(e){ flushing=false; setStatus("offline"); throw e; });
    }
    return step();
  }
  function pull(){
    if(!syncOn()||pulling) return;
    if(document.getElementById("overlay").classList.contains("show")) return; // don't disrupt open dialogs
    if(queue.length){ scheduleFlush(); return; }
    pulling=true;
    apiGet("").then(function(tree){
      if(tree===null){ return apiSend({method:"PUT",path:"",body:localTree||{meta:{kids:{}},records:{}}}); }
      localTree=tree; rebuildState(); saveLocal(); render();
    }).then(function(){ setStatus("synced"); }).catch(function(){ setStatus("offline"); })
      .then(function(){ pulling=false; });
  }
  function startPolling(){ if(pollTimer) clearInterval(pollTimer); if(syncOn()){ pollTimer=setInterval(pull,4000); } }

  /* ================= DATES / RANGE / CALENDAR (unchanged core) ================= */
  function todayISO(){ return toISO(new Date()); }
  function toISO(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
  function fromISO(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
  function shiftDay(iso,n){ var d=fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
  function prettyDate(iso){ var d=fromISO(iso);
    var wd=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
    var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
    return wd+", "+mo+" "+d.getDate()+", "+d.getFullYear(); }
  function resolveRange(){
    var now=new Date(),y=now.getFullYear(),m=now.getMonth();
    if(range.mode==="month")  return {from:toISO(new Date(y,m,1)),to:toISO(new Date(y,m+1,0)),label:"this month"};
    if(range.mode==="year")   return {from:toISO(new Date(y,0,1)),to:toISO(new Date(y,11,31)),label:"this year"};
    if(range.mode==="30")     return {from:shiftDay(todayISO(),-29),to:todayISO(),label:"last 30 days"};
    if(range.mode==="custom") return {from:range.from||"0000-01-01",to:range.to||"9999-12-31",label:"your dates"};
    return {from:"0000-01-01",to:"9999-12-31",label:"all time"};
  }
  function countInRange(cls,r){ var n=0; for(var k in cls.records){ if(cls.records[k]&&k>=r.from&&k<=r.to) n++; } return n; }
  function countAll(cls){ var n=0; for(var k in cls.records){ if(cls.records[k]) n++; } return n; }

  function firstOfMonthISO(iso){ return iso.slice(0,7)+"-01"; }
  function calendarWindow(cls,r){
    var recs=Object.keys(cls.records).filter(function(k){return cls.records[k];}).sort();
    var todayI=todayISO(),start,end;
    if(r.from==="0000-01-01") start=recs.length?recs[0]:firstOfMonthISO(todayI); else start=r.from;
    if(r.to==="9999-12-31"){ end=todayI; if(recs.length&&recs[recs.length-1]>end) end=recs[recs.length-1]; }
    else if(range.mode==="year"||range.mode==="30"||range.mode==="month"){ end=(r.to>todayI?todayI:r.to); }
    else end=r.to;
    if(end<start) end=start;
    return {start:start,end:end};
  }
  var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  function monthGridHTML(year,month,cls,r,kid){
    var startDow=new Date(year,month,1).getDay(),dim=new Date(year,month+1,0).getDate(),todayI=todayISO(),cells="";
    for(var i=0;i<startDow;i++) cells+='<span class="cal-cell blank"></span>';
    for(var d=1;d<=dim;d++){
      var iso=year+"-"+("0"+(month+1)).slice(-2)+"-"+("0"+d).slice(-2);
      var present=!!cls.records[iso],inRange=iso>=r.from&&iso<=r.to;
      var cl="cal-cell"+(present?" present":"")+(inRange?"":" out")+(iso===todayI?" today":"");
      var style=present?' style="background:'+kid.color+'"':'';
      cells+='<button class="'+cl+'" data-date="'+iso+'"'+style+'>'+d+'</button>';
    }
    return '<div class="cal-month"><div class="cal-title">'+MONTHS[month]+' '+year+'</div>'+
      '<div class="cal-dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>'+
      '<div class="cal-grid">'+cells+'</div></div>';
  }
  function calendarHTML(cls,r,kid){
    var w=calendarWindow(cls,r),sd=fromISO(w.start),ed=fromISO(w.end);
    var months=[],y=sd.getFullYear(),m=sd.getMonth(),ey=ed.getFullYear(),em=ed.getMonth();
    while(y<ey||(y===ey&&m<=em)){ months.push([y,m]); m++; if(m>11){m=0;y++;} if(months.length>72) break; }
    var truncated=false; if(months.length>36){ months=months.slice(months.length-36); truncated=true; }
    var html='<div class="cal-legend"><span><i style="background:'+kid.color+'"></i>Attended</span><span><i style="box-shadow:inset 0 0 0 2px var(--accent);background:var(--bg)"></i>Today</span></div>';
    if(truncated) html+='<div class="cal-note">Showing the most recent 36 months.</div>';
    months.forEach(function(ym){ html+=monthGridHTML(ym[0],ym[1],cls,r,kid); });
    return html;
  }
  function starSVG(color){ return '<svg width="22" height="22" viewBox="0 0 24 24" fill="'+color+'" stroke="rgba(0,0,0,.12)" stroke-width="1"><path d="M12 2.2l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.06 6.19 20.1 7.3 13.63 2.6 9.05l6.5-.95z"/></svg>'; }
  function starsMarkup(count,color){ if(count===0) return '<span class="empty">No stars yet — mark a day to add one.</span>';
    var cap=30,html="",n=Math.min(count,cap); for(var i=0;i<n;i++) html+=starSVG(color); if(count>cap) html+='<span class="more">+'+(count-cap)+'</span>'; return html; }

  function applyTheme(kid){ var root=document.documentElement.style;
    if(kid){ root.setProperty("--accent",kid.color); root.setProperty("--accent-soft",kid.soft); root.setProperty("--kidc",kid.color); }
    else{ root.setProperty("--accent","#7A5CF0"); root.setProperty("--accent-soft","#EEE9FE"); root.setProperty("--kidc","#7A5CF0"); } }
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }

  /* ================= RENDER ================= */
  var kidbar=document.getElementById("kidbar"), cardsEl=document.getElementById("cards");
  function renderKidbar(){
    kidbar.innerHTML="";
    state.kids.forEach(function(k){
      var b=document.createElement("button");
      b.className="kid"+(k.id===state.activeKidId?" active":"");
      b.style.setProperty("--kidc",k.color);
      b.innerHTML='<span class="bubble" style="background:'+k.soft+'">'+k.emoji+'</span><span class="kn">'+escapeHtml(k.name)+'</span>';
      b.addEventListener("click",function(){ state.activeKidId=k.id; ui.activeKidId=k.id; saveLocal(); render(); });
      kidbar.appendChild(b);
    });
    var add=document.createElement("button"); add.className="kid add";
    add.innerHTML='<span class="bubble">+</span><span class="kn">Add kid</span>';
    add.addEventListener("click",openAddKid); kidbar.appendChild(add);
  }
  function render(){
    var kid=activeKid(); applyTheme(kid); renderKidbar(); renderStatus();
    var hasKid=!!kid;
    document.getElementById("markingBar").style.display=hasKid?"":"none";
    document.getElementById("rangeWrap").style.display=hasKid?"":"none";
    document.getElementById("addClass").style.display=hasKid?"":"none";
    document.getElementById("editKid").style.display=hasKid?"":"none";
    document.getElementById("hAva").textContent=hasKid?kid.emoji:"🙂";
    document.getElementById("kidName").textContent=hasKid?kid.name:"Add your first kid";
    if(!hasKid){ cardsEl.innerHTML='<div class="empty-state"><span class="em">🧒</span><b>No kids yet</b>Tap the dashed circle above to add your first kid, give them a color and an animal, then start marking classes.</div>'; return; }

    var isToday=(markDate===todayISO());
    document.getElementById("markDateText").textContent=isToday?"Today":prettyDate(markDate).split(", ").slice(0,2).join(", ");
    document.getElementById("markDateSub").textContent=isToday?prettyDate(markDate):prettyDate(markDate).split(", ").slice(2).join("");
    document.getElementById("jumpToday").disabled=isToday;
    document.getElementById("markDatePicker").value=markDate;

    var r=resolveRange();
    if(!kid.classes.length){ cardsEl.innerHTML='<div class="empty-state"><span class="em">📚</span><b>No classes yet for '+escapeHtml(kid.name)+'</b>Add a class below — piano, swimming, tuition — then mark the days they show up.</div>'; return; }

    cardsEl.innerHTML="";
    kid.classes.forEach(function(cls){
      var inRange=countInRange(cls,r),all=countAll(cls),present=!!cls.records[markDate];
      var card=document.createElement("div"); card.className="card";
      card.innerHTML=
        '<div class="card-top"><div class="cname"></div><button class="menu-btn" aria-label="Options">⋯</button></div>'+
        '<div class="readout"><span class="bignum">'+inRange+'</span><span class="unit">day'+(inRange===1?'':'s')+' · '+r.label+'</span>'+
          '<span class="alltime">all time<b>'+all+'</b></span></div>'+
        '<div class="stars">'+starsMarkup(inRange,kid.color)+'</div>'+
        '<button class="mark-btn'+(present?' on':'')+'">'+
          (present?'<span class="tick">✓</span> Present '+(isToday?'today':'this day'):'Mark present '+(isToday?'today':'this day'))+'</button>'+
        '<div class="cal-toggle-row"><button class="cal-toggle">'+(openCals[cls.id]?'▲ Hide calendar':'📅 Show calendar')+'</button></div>'+
        (openCals[cls.id]?('<div class="cal">'+calendarHTML(cls,r,kid)+'</div>'):'');
      card.querySelector(".cname").textContent=cls.name;
      var btn=card.querySelector(".mark-btn");
      btn.addEventListener("click",function(){
        var turningOn=!cls.records[markDate];
        applyOps(opMarkDay(kid.id,cls.id,markDate,turningOn));
        if(turningOn) celebrate(btn,kid.color);
        render();
      });
      card.querySelector(".menu-btn").addEventListener("click",function(){ openClassMenu(kid,cls); });
      card.querySelector(".cal-toggle").addEventListener("click",function(){ if(openCals[cls.id]) delete openCals[cls.id]; else openCals[cls.id]=true; render(); });
      var calEl=card.querySelector(".cal");
      if(calEl){ calEl.addEventListener("click",function(e){
        var c=e.target.closest(".cal-cell"); if(!c) return; var d=c.getAttribute("data-date"); if(!d) return;
        var turningOn=!cls.records[d];
        applyOps(opMarkDay(kid.id,cls.id,d,turningOn));
        if(turningOn) celebrate(c,kid.color);
        render();
      }); }
      cardsEl.appendChild(card);
    });
  }

  function celebrate(btn,color){
    if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    var rect=btn.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    for(var i=0;i<9;i++){ (function(){ var s=document.createElement("div"); s.className="pop"; s.textContent="⭐";
      s.style.left=cx+"px"; s.style.top=cy+"px"; document.body.appendChild(s);
      var ang=(Math.random()*Math.PI)-Math.PI,dist=60+Math.random()*70,dx=Math.cos(ang)*dist,dy=-Math.abs(Math.sin(ang)*dist)-30-Math.random()*40;
      s.animate([{transform:"translate(-50%,-50%) scale(.4) rotate(0deg)",opacity:1},{transform:"translate("+dx+"px,"+dy+"px) scale(1.1) rotate("+(Math.random()*360)+"deg)",opacity:0}],{duration:750+Math.random()*250,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=function(){ s.remove(); };
    })(); }
  }

    setTimeout(function(){ document.getElementById("kidNameInput").focus(); },80);
  }
  function openAddKid(){ kidSheet({title:"Add a kid",confirmLabel:"Add kid",onConfirm:function(v){
    var k={id:kidId(),name:v.name,emoji:v.emoji,color:v.color,soft:v.soft};
    applyOps(opAddKid(k,state.kids.length)); state.activeKidId=k.id; ui.activeKidId=k.id; saveLocal(); render(); toast(v.name+" added ⭐"); }}); }
  document.getElementById("editKid").addEventListener("click",function(){ var kid=activeKid(); if(!kid) return;
    kidSheet({title:"Edit "+kid.name,name:kid.name,emoji:kid.emoji,color:kid.color,confirmLabel:"Save",
      onConfirm:function(v){ applyOps(opEditKid({id:kid.id,name:v.name,emoji:v.emoji,color:v.color,soft:v.soft})); render(); },
      onDelete:function(){ var cc=kid.classes.length;
        confirmSheet({title:"Delete "+kid.name+"?",danger:true,confirmLabel:"Delete",
          desc:"This removes "+kid.name+" and their "+cc+" class"+(cc===1?"":"es")+" with all stars. Can't be undone (except from a backup).",
          onConfirm:function(){ applyOps(opDeleteKid(kid.id)); if(state.activeKidId===kid.id){ state.activeKidId=state.kids.length?state.kids[0].id:null; ui.activeKidId=state.activeKidId; saveLocal(); } render(); toast("Kid deleted"); }}); }});
  });

  document.getElementById("addClass").addEventListener("click",function(){ var kid=activeKid(); if(!kid) return;
    promptSheet({title:"Add a class",desc:"What's it called?",placeholder:"e.g. Piano, Swimming, Math tuition",confirmLabel:"Add class",
      onConfirm:function(name){ applyOps(opAddClass(kid.id,{id:classId(),name:name},kid.classes.length)); render(); toast("Class added"); }}); });
  function openClassMenu(kid,cls){
    sheet.innerHTML='<h3></h3><div class="actions col"><button class="btn ghost" id="mRename">Rename class</button><button class="btn warn" id="mDelete">Delete class</button><button class="btn ghost" id="mClose">Close</button></div>';
    sheet.querySelector("h3").textContent=cls.name; overlay.classList.add("show");
    document.getElementById("mClose").addEventListener("click",closeModal);
    document.getElementById("mRename").addEventListener("click",function(){ closeModal();
      promptSheet({title:"Rename class",value:cls.name,confirmLabel:"Save name",onConfirm:function(n){ applyOps(opRenameClass(kid.id,cls.id,n)); render(); }}); });
    document.getElementById("mDelete").addEventListener("click",function(){ closeModal(); var total=countAll(cls);
      confirmSheet({title:'Delete "'+cls.name+'"?',danger:true,confirmLabel:"Delete",
        desc:"This removes the class and its "+total+" recorded day"+(total===1?"":"s")+". Can't be undone (except from a backup).",
        onConfirm:function(){ applyOps(opDeleteClass(kid.id,cls.id)); render(); toast("Class deleted"); }}); });
  }

  /* ================= SYNC UI ================= */
  document.getElementById("statusPill").addEventListener("click",openSyncSheet);
  document.getElementById("syncBtn").addEventListener("click",openSyncSheet);
  function openSyncSheet(){
    if(syncOn()){
      sheet.innerHTML='<h3>Sharing is on</h3>'+
        '<p>This phone is syncing live. Anything you or the other phone changes shows up within a few seconds.</p>'+
        '<div class="share-box"><b>Share these with the other phone</b><div class="v" id="shDb"></div><b>Space code</b><div class="v" id="shCode" style="margin-bottom:0"></div></div>'+
        '<p class="disc">On the other phone: open this same app, tap the status button up top, choose “Set up sharing”, and enter exactly these two values.</p>'+
        '<div class="actions col"><button class="btn ghost" id="syncCopy">Copy details to share</button><button class="btn warn" id="syncOff">Turn off sharing on this phone</button><button class="btn ghost" id="syncClose">Close</button></div>';
      overlay.classList.add("show");
      document.getElementById("shDb").textContent=cleanUrl(syncCfg.dbUrl);
      document.getElementById("shCode").textContent=cleanCode(syncCfg.code);
      document.getElementById("syncClose").addEventListener("click",closeModal);
      document.getElementById("syncCopy").addEventListener("click",function(){
        var txt="Attendance app sync\nDatabase URL: "+cleanUrl(syncCfg.dbUrl)+"\nSpace code: "+cleanCode(syncCfg.code);
        if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ toast("Copied — send it to the other phone"); },function(){ toast("Couldn't copy; long-press to select"); }); }
        else toast("Long-press the text to copy");
      });
      document.getElementById("syncOff").addEventListener("click",function(){ closeModal();
        confirmSheet({title:"Turn off sharing here?",desc:"This phone stops syncing and goes back to on-phone only. Your current data stays on this phone. The shared space and the other phone are not affected.",confirmLabel:"Turn off",
          onConfirm:function(){ syncCfg=null; saveSync(); queue=[]; saveQueue(); if(pollTimer) clearInterval(pollTimer); setStatus("local"); toast("Sharing turned off"); }});
      });
    } else {
      sheet.innerHTML='<h3>Share with another phone</h3>'+
        '<p>Sync live between phones using your own free Google Firebase database. One-time setup, about 2 minutes.</p>'+
        '<div class="guide"><b>Set up the free database (do this once, on either phone):</b>'+
          '<ol>'+
          '<li>Go to <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a> and sign in with Google.</li>'+
          '<li>Click <b>Add project</b>, give it any name, and finish (you can skip Analytics).</li>'+
          '<li>In the left menu open <b>Build → Realtime Database</b>, click <b>Create Database</b>, pick a location, and choose <b>Start in test mode</b>.</li>'+
          '<li>Copy the database web address shown at the top — it looks like <code>https://your-project-default-rtdb.firebaseio.com</code>. Paste it below.</li>'+
          '<li>Pick any <b>space code</b> — a secret word you and your partner share (e.g. <code>sharma-family-7</code>).</li>'+
          '</ol></div>'+
        '<label class="fld">Firebase database URL</label><input type="text" id="syncUrl" placeholder="https://your-project-default-rtdb.firebaseio.com">'+
        '<label class="fld">Space code (shared secret)</label><input type="text" id="syncCode" placeholder="e.g. sharma-family-7">'+
        '<div class="result" id="syncResult"></div>'+
        '<p class="disc">Anyone who has both the URL and the space code can see this data, so keep the code private. It’s stored in your own Firebase, not on Anthropic’s servers.</p>'+
        '<div class="actions"><button class="btn ghost" id="syncTest">Test connection</button><button class="btn primary" id="syncGo">Turn on sync</button></div>'+
        '<div class="actions" style="margin-top:10px;"><button class="btn ghost" id="syncClose2">Cancel</button></div>';
      overlay.classList.add("show");
      document.getElementById("syncClose2").addEventListener("click",closeModal);
      document.getElementById("syncTest").addEventListener("click",function(){
        var url=cleanUrl(document.getElementById("syncUrl").value), code=cleanCode(document.getElementById("syncCode").value);
        var res=document.getElementById("syncResult");
        if(!url||!code){ res.className="result bad"; res.textContent="Please enter both the database URL and a space code."; return; }
        res.className="result"; res.style.display="block"; res.textContent="Testing…";
        var cfg={dbUrl:url,code:code}, b=baseUrl(cfg);
        fetch(b+"/_conntest.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:"true"})
          .then(function(r){ if(!r.ok) throw new Error("write failed (HTTP "+r.status+")"); return fetch(b+"/_conntest.json",{cache:"no-store"}); })
          .then(function(r){ if(!r.ok) throw new Error("read failed (HTTP "+r.status+")"); return r.json(); })
          .then(function(v){ if(v!==true) throw new Error("read-back mismatch"); return fetch(b+"/_conntest.json",{method:"DELETE"}); })
          .then(function(){ res.className="result ok"; res.textContent="✓ Connection works. Reading and writing both succeeded — you can turn on sync."; })
          .catch(function(e){ res.className="result bad"; res.textContent="✗ Couldn't connect: "+e.message+". Check the URL is exactly as shown in Firebase, that Realtime Database is created and in test mode, and that you're online."; });
      });
      document.getElementById("syncGo").addEventListener("click",function(){
        var url=cleanUrl(document.getElementById("syncUrl").value), code=cleanCode(document.getElementById("syncCode").value);
        var res=document.getElementById("syncResult");
        if(!url||!code){ res.className="result bad"; res.textContent="Please enter both the database URL and a space code."; return; }
        connect(url,code);
      });
    }
  }
  function connect(url,code){
    var cfg={dbUrl:url,code:code};
    setStatus("syncing");
    apiGet("",cfg).then(function(tree){
      if(tree===null){
        return apiSend({method:"PUT",path:"",body:localTree||{meta:{kids:{}},records:{}}},cfg).then(function(){
          syncCfg=cfg; saveSync(); queue=[]; saveQueue(); closeModal(); startPolling(); setStatus("synced"); render(); toast("Sync on — shared space created ⭐");
        });
      } else {
        closeModal();
        confirmSheet({title:"Join this shared space?",confirmLabel:"Join & use shared data",
          desc:"This space already has data. This phone will switch to the shared copy — its current on-phone data will be replaced. Tip: use Back up first if you're unsure.",
          onConfirm:function(){ syncCfg=cfg; saveSync(); queue=[]; saveQueue(); localTree=tree; rebuildState(); saveLocal(); startPolling(); setStatus("synced"); render(); toast("Joined shared space ⭐"); },
          onCancel:function(){ setStatus(syncOn()?"synced":"local"); }});
      }
    }).catch(function(e){
      var res=document.getElementById("syncResult");
      if(res){ res.className="result bad"; res.textContent="✗ Couldn't connect: "+e.message+". Use Test connection to check the details."; }
      setStatus(syncOn()?"synced":"local");
    });
  }

  /* ================= BACKUP / RESTORE ================= */
  document.getElementById("exportBtn").addEventListener("click",function(){
    var out={kids:state.kids}; // export as readable state
    var blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"}), url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download="attendance-backup-"+todayISO()+".json"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },1000); toast("Backup downloaded");
  });
  document.getElementById("importBtn").addEventListener("click",function(){ document.getElementById("importFile").click(); });
  document.getElementById("importFile").addEventListener("change",function(e){
    var file=e.target.files[0]; if(!file) return; var reader=new FileReader();
    reader.onload=function(){
      var data; try{ data=JSON.parse(reader.result); }catch(err){ toast("That file isn't a valid backup"); return; }
      var kids = Array.isArray(data.kids)?data.kids : (Array.isArray(data.classes)?[{id:kidId(),name:data.name||"My kid",emoji:"🌟",color:PALETTE[0].c,soft:PALETTE[0].soft,classes:data.classes}] : null);
      if(!kids){ toast("That file isn't a valid backup"); return; }
      confirmSheet({title:"Restore this backup?",desc:"It has "+kids.length+" kid"+(kids.length===1?"":"s")+". This replaces everything currently "+(syncOn()?"in the shared space":"on this phone")+".",confirmLabel:"Restore",
        onConfirm:function(){
          localTree=stateToTree({kids:kids}); rebuildState(); saveLocal(); render();
          if(syncOn()){ queue=[]; saveQueue(); apiSend({method:"PUT",path:"",body:localTree}).then(function(){ setStatus("synced"); },function(){ setStatus("offline"); }); }
          toast("Backup restored");
        }});
    };
    reader.readAsText(file); e.target.value="";
  });

  /* ================= TOAST ================= */
  var toastEl=document.getElementById("toast"), toastTimer;
  function toast(m){ toastEl.textContent=m; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toastEl.classList.remove("show"); },2000); }

  /* ================= BOOT ================= */
  loadLocal(); render();
  if(syncOn()){ setStatus("syncing"); startPolling(); pull(); }
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) pull(); });
  window.addEventListener("focus",pull);
  window.addEventListener("online",function(){ scheduleFlush(); pull(); });
})();
</script>
</body>
</html>
